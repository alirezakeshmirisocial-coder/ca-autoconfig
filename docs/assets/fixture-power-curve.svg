  <desc id="description">FIXTURE / NOT HARDWARE EVIDENCE. Synthetic data exercises the pipeline only. Power window: steady-state. Rate window: steady-state. Energy aligned: True. 2 runs, 2 profiles, 0 failed or incomplete. Axes compare generation tok/s against mean combined board power in watts. GPU0 280 W + GPU1 280 W: 490 W mean combined board power, 21.2 generation tok/s, 1 of 1 runs passed; GPU0 350 W + GPU1 350 W: 610 W mean combined board power, 22 generation tok/s, 1 of 1 runs passed. Synthetic fixture leader, not a hardware result. Selected profile: GPU0 280 W + GPU1 280 W. Exact anonymized raw JSON and method are required; this is not a universal recommendation.</desc>
